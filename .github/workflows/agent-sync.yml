name: Agent Context Sync

on:
  push:
    branches: [main]
    paths:
      - '.agent/sections/**'
      - '.agent/scripts/**'

jobs:
  sync:
    name: Regenerate AGENT.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regenerate Agent Context
        run: node .agent/scripts/summarize.js
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: regenerate AGENT.md from sources [skip ci]"
          file_pattern: 'AGENT.md'
